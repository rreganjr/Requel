name: CI

# Build, test, and report coverage on every push and pull request that
# targets master or any release/* branch. The release/2.0 cycle uses this
# workflow as the gate for merging feature branches into the integration
# branch. See doc/20-release-plan.md §5.1.

on:
  push:
    branches:
      - master
      - "release/**"
  pull_request:
    branches:
      - master
      - "release/**"

# Cancel earlier runs of the same workflow on the same ref. Useful when
# someone force-pushes a feature branch and the in-flight run becomes stale.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write

jobs:
  build-and-test:
    name: Build & test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      # The root pom's maven-toolchains-plugin runs during the `validate`
      # phase and requires ~/.m2/toolchains.xml to contain a matching JDK
      # entry (vendor=any, version=17). GitHub runners don't ship one, so
      # without this step every Maven build fails before reaching compile.
      # See doc/MAVEN_TOOLCHAINS.md for the local-dev equivalent.
      - name: Write Maven toolchains.xml
        run: |
          mkdir -p "$HOME/.m2"
          cat > "$HOME/.m2/toolchains.xml" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <toolchains>
            <toolchain>
              <type>jdk</type>
              <provides>
                <version>17</version>
                <vendor>any</vendor>
              </provides>
              <configuration>
                <jdkHome>${JAVA_HOME}</jdkHome>
              </configuration>
            </toolchain>
          </toolchains>
          EOF

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: requel-angular/package-lock.json

      # `mvn verify` triggers the frontend-maven-plugin in modules/requel-app
      # which downloads its own Node into target/ and runs `npm install` +
      # `ng build` for the Angular bundle, then proceeds with the Java build.
      # Surefire runs the unit suite during the `test` phase; failsafe (added
      # to the root pom alongside this workflow) runs the *IT.java integration
      # tests during the `integration-test`/`verify` phases. JaCoCo writes a
      # combined HTML+XML coverage report to **/target/site/jacoco/.
      - name: Maven build, unit + integration tests, Angular bundle
        run: >
          mvn -pl modules/requel-app -am verify
          --batch-mode --no-transfer-progress
          -Dstyle.color=always

      # The frontend-maven-plugin only invokes `ng build`, not `ng test`.
      # Run the Vitest unit suite separately using the host-installed Node.
      # `--no-watch` makes the runner exit after one pass (default is watch).
      - name: Angular unit tests (Vitest)
        working-directory: requel-angular
        run: |
          npm ci
          npm test -- --no-watch

      - name: Upload JaCoCo coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-coverage
          path: "**/target/site/jacoco/"
          if-no-files-found: warn
          retention-days: 14

      - name: Upload backend coverage to Codecov
        if: always()
        uses: codecov/codecov-action@v5
        with:
          files: "**/target/site/jacoco/jacoco.xml"
          flags: backend
          name: jacoco-backend
          fail_ci_if_error: false
          use_oidc: true

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            **/target/surefire-reports/
            **/target/failsafe-reports/
          if-no-files-found: ignore
          retention-days: 14

  e2e:
    name: E2E + frontend coverage
    needs: build-and-test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: password
          MYSQL_DATABASE: requel
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -ppassword"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Write Maven toolchains.xml
        run: |
          mkdir -p "$HOME/.m2"
          cat > "$HOME/.m2/toolchains.xml" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <toolchains>
            <toolchain>
              <type>jdk</type>
              <provides>
                <version>17</version>
                <vendor>any</vendor>
              </provides>
              <configuration>
                <jdkHome>${JAVA_HOME}</jdkHome>
              </configuration>
            </toolchain>
          </toolchains>
          EOF

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: requel-angular/package-lock.json

      - name: Build app jar
        run: >
          mvn -pl modules/requel-app -am package
          --batch-mode --no-transfer-progress
          -DskipTests
          -Dstyle.color=always

      - name: Install Playwright browsers
        working-directory: requel-angular
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Run Playwright with coverage
        run: |
          APP_JAR="$(find modules/requel-app/target -maxdepth 1 -name 'requel-app-*.jar' ! -name '*-sources.jar' | head -n 1)"
          java -jar "$APP_JAR" \
            --spring.profiles.active=dev \
            --server.port=8080 \
            '--spring.datasource.url=jdbc:mysql://127.0.0.1:3306/requel?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC' \
            --spring.datasource.username=root \
            --spring.datasource.password=password \
            --requel.dictionary.sql-initializer.enabled=false \
            > requel-e2e.log 2>&1 &
          APP_PID=$!
          trap 'kill "$APP_PID" 2>/dev/null || true' EXIT

          for i in {1..60}; do
            if curl -fsS http://localhost:8080/actuator/health > /dev/null; then
              break
            fi
            sleep 2
          done

          if ! curl -fsS http://localhost:8080/actuator/health > /dev/null; then
            cat requel-e2e.log
            exit 1
          fi

          reset_dev_fixture() {
            local path="$1"
            for i in {1..60}; do
              if curl -fsS -X POST "http://localhost:8080${path}" > /dev/null; then
                return 0
              fi
              sleep 2
            done
            echo "Timed out waiting for ${path}"
            cat requel-e2e.log
            exit 1
          }

          reset_dev_fixture /api/dev/reset-admin
          reset_dev_fixture /api/dev/reset-project

          (cd requel-angular && npm run e2e:coverage)

      - name: Upload E2E coverage to Codecov
        if: always()
        uses: codecov/codecov-action@v5
        with:
          files: requel-angular/coverage/lcov.info
          flags: frontend-e2e
          name: monocart-frontend-e2e
          fail_ci_if_error: false
          use_oidc: true

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            requel-angular/playwright-report/
            requel-e2e.log
          if-no-files-found: ignore
          retention-days: 14
