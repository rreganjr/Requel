# Unique in-memory DB per Spring context so distinct test contexts (e.g. the
# requel.nlp.enabled=false contexts) cannot clobber each other's create-drop schema and
# seeded admin/project users. ${random.uuid} resolves once per context.
spring.datasource.url=jdbc:h2:mem:requel-${random.uuid};MODE=MYSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_UPPER=false
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
# Disable Flyway during tests that rely on Hibernate DDL generation
spring.flyway.enabled=false

# Spring AI's OpenAI autoconfiguration (spring.ai.model.chat=openai) instantiates the openAiApi
# bean at context startup and requires a non-blank key, even though tests never call out (the AI
# assistant is off and provider=noop). The main application.properties default
# (${REQUEL_AI_API_KEY:not-set}) only applies when the variable is ABSENT — if the environment
# exports REQUEL_AI_API_KEY as an empty string (as some IDE/terminal setups do), it resolves to ""
# and every Spring-context test fails to load with "OpenAI API key must be set". Pin a dummy here so
# the test context is hermetic regardless of the developer's environment. Never used for real calls.
spring.ai.openai.api-key=test-not-used
# Same for the Anthropic starter (ai-anthropic profile / SpringAiAnthropicProviderContextLoadsTest,
# which selects spring.ai.model.chat=anthropic): pin a dummy so its autoconfiguration is satisfied.
spring.ai.anthropic.api-key=test-not-used
