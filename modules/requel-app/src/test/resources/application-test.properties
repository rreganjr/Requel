# Unique in-memory DB per Spring context so distinct test contexts (e.g. the
# requel.nlp.enabled=false contexts) cannot clobber each other's create-drop schema and
# seeded admin/project users. ${random.uuid} resolves once per context.
spring.datasource.url=jdbc:h2:mem:requel-${random.uuid};MODE=MYSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_UPPER=false
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
# Disable Flyway during tests that rely on Hibernate DDL generation
spring.flyway.enabled=false
