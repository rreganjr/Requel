# ---------------------------------------------------------------------------
# Profile: ai-ollama  (local Ollama via its OpenAI-compatible endpoint)
# ---------------------------------------------------------------------------
# Activate alongside your run profile, e.g.:
#   --spring.profiles.active=dev,ai-ollama
#
# Ollama exposes an OpenAI-compatible API at <host>:11434/v1, so this rides the OpenAI starter with
# provider=openai-compat — no Ollama-specific dependency. The model must already be PULLED on the
# Ollama server (e.g. `ollama pull llama3.1`); the property below only names which pulled model to
# request. Override per run with REQUEL_AI_MODEL, and point at a remote/container Ollama with
# REQUEL_AI_BASE_URL (e.g. http://ollama:11434 in docker-compose).
#
# Ollama ignores the API key, so the dummy default is fine; no REQUEL_AI_API_KEY needed.
requel.ai.enabled=true
requel.ai.provider=openai-compat
requel.ai.model=${REQUEL_AI_MODEL:llama3.1}

spring.ai.model.chat=openai
spring.ai.openai.api-key=${REQUEL_AI_API_KEY:ollama-local-no-key}
spring.ai.openai.base-url=${REQUEL_AI_BASE_URL:http://localhost:11434}
spring.ai.openai.chat.options.model=${REQUEL_AI_MODEL:llama3.1}
