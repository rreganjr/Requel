# ---------------------------------------------------------------------------
# Profile: ai-gemini  (Google Gemini via its OpenAI-compatible endpoint)
# ---------------------------------------------------------------------------
# Activate alongside your run profile, e.g.:
#   --spring.profiles.active=dev,ai-gemini
# Supply the secret at start time: REQUEL_AI_API_KEY=<Google AI Studio API key>. Override the model
# per run with REQUEL_AI_MODEL.
#
# Google exposes an OpenAI-compatible surface at
#   https://generativelanguage.googleapis.com/v1beta/openai/chat/completions
# so this rides the OpenAI starter (provider=openai-compat) — no Gemini/Vertex dependency. Because
# the path is /v1beta/openai/... (not OpenAI's default /v1/...), we set base-url to that root and
# override the completions path. NOTE: verify the endpoint/model at runtime; Google may revise the
# compat path or model ids.
requel.ai.enabled=true
requel.ai.provider=openai-compat
requel.ai.model=${REQUEL_AI_MODEL:gemini-2.0-flash}

spring.ai.model.chat=openai
spring.ai.openai.api-key=${REQUEL_AI_API_KEY:dummy-set-REQUEL_AI_API_KEY}
spring.ai.openai.base-url=${REQUEL_AI_BASE_URL:https://generativelanguage.googleapis.com/v1beta/openai}
spring.ai.openai.chat.completions-path=${REQUEL_AI_COMPLETIONS_PATH:/chat/completions}
spring.ai.openai.chat.options.model=${REQUEL_AI_MODEL:gemini-2.0-flash}
