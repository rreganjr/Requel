# ---------------------------------------------------------------------------
# Profile: ai-openai  (hosted OpenAI)
# ---------------------------------------------------------------------------
# Activate alongside your run profile, e.g.:
#   --spring.profiles.active=dev,ai-openai
# Supply the secret at start time: REQUEL_AI_API_KEY=sk-...  (the dummy default below only lets the
# context boot; a real call needs a real key). Override the model per run with REQUEL_AI_MODEL.
#
# This profile selects the provider; you no longer need REQUEL_AI_PROVIDER. (REQUEL_AI_* env vars
# still override these values if set.)
requel.ai.enabled=true
requel.ai.provider=openai
requel.ai.model=${REQUEL_AI_MODEL:gpt-4o-mini}

# Spring AI transport: hosted OpenAI chat model.
spring.ai.model.chat=openai
spring.ai.openai.api-key=${REQUEL_AI_API_KEY:dummy-set-REQUEL_AI_API_KEY}
spring.ai.openai.base-url=${REQUEL_AI_BASE_URL:https://api.openai.com}
spring.ai.openai.chat.options.model=${REQUEL_AI_MODEL:gpt-4o-mini}
