# Development profile — activate with --spring.profiles.active=dev
# Allows the Angular dev server (ng serve) to reach the API when running locally.
spring.cors.allowed-origins=http://localhost:4200

# Register the /api/dev/reset-* endpoints used by the Playwright global-setup
# to put built-in users back to canonical state before each E2E run. These
# endpoints are unauthenticated and destructive (they bypass normal auth to
# rewrite admin/project credentials), so they MUST stay out of production
# builds — they're guarded by @ConditionalOnProperty per-endpoint and only
# turned on here in the dev profile.
requel.dev.reset-admin.enabled=true
requel.dev.reset-project.enabled=true

# MCP OAuth 2.1 client registration — DEV/LOCAL testing only (issues #83, #238).
# These make `--spring.profiles.active=dev` a ready-to-test OAuth setup so codex/claude
# `mcp login` can be exercised without extra launch flags. The embedded authorization
# server itself is always on; these only control client seeding/registration policy.
# NOT for production: the registrar secret below is a throwaway local value, and
# allow-anonymous-loopback opens (loopback-only, consent-gated) self-registration.
#
# Anonymous, loopback-only Dynamic Client Registration (issue #238): lets a client that
# self-registers over RFC 7591 succeed when its redirect URIs are loopback. This is what
# makes `codex mcp login requel` work with no PAT and no pre-registration.
requel.oauth.dcr.allow-anonymous-loopback=true
# Gated DCR (issue #83): seeds the `requel-registrar` client so the initial-access-token
# path works too — used by Claude Code's pre-registered-client_id flow and the Part C
# DCR curl tests in doc/83-oauth-verification.md.
requel.oauth.dcr.enabled=true
requel.oauth.dcr.registrar-client-secret=dev-registrar-secret
# Seed the loopback PKCE dev client (requel-dev-client) for the manual authorization-code
# + PKCE walkthrough (Part B of the verification runbook).
requel.oauth.seed-dev-client=true
