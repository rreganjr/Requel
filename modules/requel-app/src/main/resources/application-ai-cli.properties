# ---------------------------------------------------------------------------
# Profile: ai-cli  (DEVELOPMENT ONLY - drive a locally authenticated claude/codex CLI, #259)
# ---------------------------------------------------------------------------
# Activate alongside the dev profile and point at the CLI binary (absolute path):
#   --spring.profiles.active=dev,ai-cli --requel.ai.cli.command="$(which claude)"
# or set REQUEL_AI_CLI_COMMAND. The app refuses to start if the command is missing, relative or not
# executable.
#
# This shells out to the CLI you are logged in to on your own machine, with your subscription. It is
# NOT a deployment provider: it does not work in the Docker image, must not be used to serve other
# users, and until #262 it sends project text unredacted - use test projects only.
# See doc/guides/AI_ASSISTANT_SETUP.md ("Development only: the cli provider").
#
# The prompt goes on stdin; the args below never carry project text. The child gets only PATH,
# HOME, USER, LANG and TMPDIR (plus names in requel.ai.cli.env) and runs in an empty temp dir.
requel.ai.enabled=true
requel.ai.provider=cli
requel.ai.model=${REQUEL_AI_MODEL:claude-cli}

# No Spring AI chat model: nothing demands an API key at boot.
spring.ai.model.chat=none

requel.ai.cli.command=${REQUEL_AI_CLI_COMMAND:}
requel.ai.cli.timeout=180s
requel.ai.cli.max-output-bytes=1048576

# --- claude (default): print mode, JSON envelope, no tools, no MCP servers, one turn -------------
# --tools "" disables every built-in tool; --strict-mcp-config with no --mcp-config loads no MCP
# servers (so a review cannot call back into Requel's own /api/mcp). Indexed form because
# args[4] is an empty string.
requel.ai.cli.output-format=claude-json
requel.ai.cli.args[0]=-p
requel.ai.cli.args[1]=--output-format
requel.ai.cli.args[2]=json
requel.ai.cli.args[3]=--tools
requel.ai.cli.args[4]=
requel.ai.cli.args[5]=--strict-mcp-config
requel.ai.cli.args[6]=--max-turns
requel.ai.cli.args[7]=1

