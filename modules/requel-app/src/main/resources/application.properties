# Datasource defaults — local MySQL on the conventional host/port/credentials.
# These are loaded regardless of which Spring profile is active so that
# activating `dev` (or any other profile that doesn't override them) doesn't
# leave the application without a datasource. Profile-specific files like
# application-test.properties (H2 in-memory) override these for their
# respective profiles. Production deployments override via environment
# variables (SPRING_DATASOURCE_URL etc., see docker-compose.yml).
spring.datasource.url=jdbc:mysql://localhost:3306/requel?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=password
spring.jpa.hibernate.ddl-auto=none

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

# AI assistant (issue #43 Phase 5; provider layer on Spring AI per issue #77). Disabled by default;
# opt in per deployment. Configure with environment variables (Spring maps REQUEL_AI_* -> requel.ai.*;
# transport vars are bridged to spring.ai.* below). See doc/AI_ASSISTANT_SETUP.md.
#   REQUEL_AI_ENABLED=true            registers the RequirementsReviewAssistant
#   REQUEL_AI_PROVIDER=openai         provider client: openai | openai-compat | noop
#                                     (default "noop" = built-in stub, no network, no findings;
#                                      openai-compat = any OpenAI-style server such as a local
#                                      Ollama/LM Studio/vLLM/LocalAI; anthropic is a fast-follow,
#                                      not yet available)
#   REQUEL_AI_MODEL=<model-id>        a current model id for the chosen provider
#   REQUEL_AI_API_KEY=<secret>        the API key (optional for a local openai-compat server)
#   REQUEL_AI_BASE_URL=<root-url>     openai-compat only: server ROOT (e.g. http://localhost:11434);
#                                     Spring AI appends /v1/chat/completions. (Replaces the former
#                                     full-URL REQUEL_AI_ENDPOINT.)
#   REQUEL_AI_PROJECT_ALLOWLIST=<ids> optional CSV of project ids permitted to use AI
# Structured output and request timeout are now Spring AI's responsibility (the former
# REQUEL_AI_STRUCTURED_OUTPUT_MODE / REQUEL_AI_TIMEOUT / REQUEL_AI_API_KEY_ENVIRONMENT_VARIABLE vars
# are no longer read).
requel.ai.enabled=false

# ---------------------------------------------------------------------------
# Spring AI OpenAI provider (Spring AI provider port)
# ---------------------------------------------------------------------------
# The spring-ai-starter-model-openai starter (in assistant-ai) backs SpringAiAnalysisClient. By
# default it auto-configures EVERY OpenAI model type (chat, embedding, image, audio, moderation),
# and each demands an API key at context startup. Requel only uses chat, so disable the rest. And
# provide a placeholder api-key default so the context always loads even when AI is disabled
# (requel.ai.provider=noop) or no key is set — otherwise simply having the starter on the classpath
# would force every deployment (and every @SpringBootTest) to supply an OpenAI key just to boot.
# A real key flows in via REQUEL_AI_API_KEY when an OpenAI/OpenAI-compatible provider is selected;
# for a local OpenAI-compatible server (Ollama/vLLM/LM Studio/LocalAI) also set
# spring.ai.openai.base-url. (The requel.ai.* -> spring.ai.* mapping is finalized in Slice 2.)
spring.ai.model.chat=openai
spring.ai.model.embedding=none
spring.ai.model.image=none
spring.ai.model.audio.speech=none
spring.ai.model.audio.transcription=none
spring.ai.model.moderation=none
#
# requel.ai.* -> spring.ai.* bridge. The existing REQUEL_AI_* environment variables keep working
# by feeding Spring AI's OpenAI settings; transport (key, base-url, model, output cap, retries) is
# now Spring AI's responsibility. REQUEL_AI_MODEL feeds BOTH the actual call
# (spring.ai.openai.chat.options.model) and the usage report (requel.ai.model), so they stay in
# sync. For a local OpenAI-compatible server (Ollama/vLLM/LM Studio/LocalAI), set
# REQUEL_AI_BASE_URL to the server ROOT (e.g. http://localhost:11434) — Spring AI appends the
# /v1/chat/completions path. (This replaces the old REQUEL_AI_ENDPOINT full-URL var and
# REQUEL_AI_STRUCTURED_OUTPUT_MODE, which the Spring AI client no longer uses; see
# doc/AI_ASSISTANT_SETUP.md.)
spring.ai.openai.api-key=${REQUEL_AI_API_KEY:not-set}
spring.ai.openai.base-url=${REQUEL_AI_BASE_URL:https://api.openai.com}
spring.ai.openai.chat.options.model=${REQUEL_AI_MODEL:gpt-4o-mini}
spring.ai.openai.chat.options.max-tokens=${REQUEL_AI_MAX_OUTPUT_TOKENS:4000}
spring.ai.retry.max-attempts=${REQUEL_AI_MAX_RETRIES:3}

# NLP toggle. true (default) wires the real Stanford/OpenNLP-backed
# NLPProcessorFactoryImpl; false swaps in NoOpNLPProcessorFactory so the app boots and
# assistants degrade to "no findings" instead of requiring NLP. Lean builds opt out
# explicitly via requel.nlp.enabled=false.
requel.nlp.enabled=true

# JWT authentication for CQRS API
requel.jwt.secret=${REQUEL_JWT_SECRET:requel-dev-secret-change-in-production-min-32-chars}
requel.jwt.expiry-hours=8

# Actuator endpoints for observability
management.endpoints.web.exposure.include=health,info,metrics,prometheus

# ---------------------------------------------------------------------------
# MCP server (Spring AI) — issue #69 Slice 4b
# ---------------------------------------------------------------------------
# The Spring AI MCP server boot starter (spring-ai-starter-mcp-server-webmvc) serves Requel's
# gateway-backed tools (RequelMcpServerConfig.requelToolCallbackProvider) over Spring MVC.
#
# Endpoints are deliberately mounted under /api/mcp/* so the existing /api/** Spring Security
# JWT chain authenticates them and CurrentUserResolver populates the user the CommandGateway runs
# as — no separate security matcher needed. If these paths change, update the security config too.
#
# Write tools are gated by requel.gateway.write.enabled. Shipped default is true so a locally-run
# server exposes the write tools out of the box; set it to false to run the MCP server read-only.
# Per-stakeholder authorization is ALWAYS enforced in the gateway regardless of this flag — it is
# the coarse on/off for the whole write surface, not a bypass of permissions.
requel.gateway.write.enabled=true
spring.ai.mcp.server.enabled=true
spring.ai.mcp.server.name=requel-mcp-server
spring.ai.mcp.server.version=2.0.0-dev
# Transport decision (issue #82): SSE only for now. SSE is verified end-to-end and works with every
# client tested (Cursor, Claude Code, MCP Inspector) using `mcp-remote --transport sse-only`.
# Streamable HTTP is the MCP spec's forward direction and is left as a future spike — whether the
# 1.1.7 WebMVC starter can serve SSE + Streamable simultaneously (vs. selecting one) is unverified,
# so it's deferred until a client actually requires it rather than enabled blind. To spike it,
# uncomment the protocol/endpoint properties below and confirm both transports at run.
spring.ai.mcp.server.sse-endpoint=/api/mcp/sse
spring.ai.mcp.server.sse-message-endpoint=/api/mcp/message
# spring.ai.mcp.server.protocol=STREAMABLE
# spring.ai.mcp.server.streamable-http.mcp-endpoint=/api/mcp
