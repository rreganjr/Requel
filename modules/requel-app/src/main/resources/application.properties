# Datasource defaults — local MySQL on the conventional host/port/credentials.
# These are loaded regardless of which Spring profile is active so that
# activating `dev` (or any other profile that doesn't override them) doesn't
# leave the application without a datasource. Profile-specific files like
# application-test.properties (H2 in-memory) override these for their
# respective profiles. Production deployments override via environment
# variables (SPRING_DATASOURCE_URL etc., see docker-compose.yml).
spring.datasource.url=jdbc:mysql://localhost:3306/requel?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=password
spring.jpa.hibernate.ddl-auto=none

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

# AI assistant (issue #43 Phase 5). Disabled by default; opt in per deployment.
# Configure entirely with environment variables (Spring maps REQUEL_AI_* -> requel.ai.*):
#   REQUEL_AI_ENABLED=true            registers the RequirementsReviewAssistant
#   REQUEL_AI_PROVIDER=openai         provider client: openai | anthropic | openai-compat | noop
#                                     (default "noop" = built-in stub, no network, no findings;
#                                      openai-compat = any OpenAI-style /v1/chat/completions server
#                                      such as a local Ollama/LM Studio/vLLM — see
#                                      doc/AI_ASSISTANT_SETUP.md and docker-compose.local-ai.yml)
#   REQUEL_AI_MODEL=<model-id>        a current model id for the chosen provider
#   REQUEL_AI_API_KEY=<secret>        the API key for the chosen provider (single, neutral var;
#                                     optional for a local openai-compat server)
#   REQUEL_AI_ENDPOINT=<url>          blank uses the provider default; required for openai-compat
#   REQUEL_AI_STRUCTURED_OUTPUT_MODE  openai-compat only: json_schema | json_object | none
#   REQUEL_AI_PROJECT_ALLOWLIST=<ids> optional CSV of project ids permitted to use AI
# One provider is active at a time (selected by REQUEL_AI_PROVIDER). The key var name can be
# overridden with REQUEL_AI_API_KEY_ENVIRONMENT_VARIABLE if you must keep a vendor-specific name.
requel.ai.enabled=false

# NLP toggle. true (default) wires the real Stanford/OpenNLP-backed
# NLPProcessorFactoryImpl; false swaps in NoOpNLPProcessorFactory so the app boots and
# assistants degrade to "no findings" instead of requiring NLP. Lean builds opt out
# explicitly via requel.nlp.enabled=false.
requel.nlp.enabled=true

# JWT authentication for CQRS API
requel.jwt.secret=${REQUEL_JWT_SECRET:requel-dev-secret-change-in-production-min-32-chars}
requel.jwt.expiry-hours=8

# Actuator endpoints for observability
management.endpoints.web.exposure.include=health,info,metrics,prometheus

# ---------------------------------------------------------------------------
# MCP server (Spring AI) — issue #69 Slice 4b
# ---------------------------------------------------------------------------
# The Spring AI MCP server boot starter (spring-ai-starter-mcp-server-webmvc) serves Requel's
# gateway-backed tools (RequelMcpServerConfig.requelToolCallbackProvider) over Spring MVC.
#
# Endpoints are deliberately mounted under /api/mcp/* so the existing /api/** Spring Security
# JWT chain authenticates them and CurrentUserResolver populates the user the CommandGateway runs
# as — no separate security matcher needed. If these paths change, update the security config too.
#
# Write tools are gated by requel.gateway.write.enabled. Shipped default is true so a locally-run
# server exposes the write tools out of the box; set it to false to run the MCP server read-only.
# Per-stakeholder authorization is ALWAYS enforced in the gateway regardless of this flag — it is
# the coarse on/off for the whole write surface, not a bypass of permissions.
requel.gateway.write.enabled=true
spring.ai.mcp.server.enabled=true
spring.ai.mcp.server.name=requel-mcp-server
spring.ai.mcp.server.version=2.0.0-dev
# Transport decision (issue #82): SSE only for now. SSE is verified end-to-end and works with every
# client tested (Cursor, Claude Code, MCP Inspector) using `mcp-remote --transport sse-only`.
# Streamable HTTP is the MCP spec's forward direction and is left as a future spike — whether the
# 1.1.7 WebMVC starter can serve SSE + Streamable simultaneously (vs. selecting one) is unverified,
# so it's deferred until a client actually requires it rather than enabled blind. To spike it,
# uncomment the protocol/endpoint properties below and confirm both transports at run.
spring.ai.mcp.server.sse-endpoint=/api/mcp/sse
spring.ai.mcp.server.sse-message-endpoint=/api/mcp/message
# spring.ai.mcp.server.protocol=STREAMABLE
# spring.ai.mcp.server.streamable-http.mcp-endpoint=/api/mcp
