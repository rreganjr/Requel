# ---------------------------------------------------------------------------
# Profile: ai-anthropic  (Anthropic Claude, native Spring AI Anthropic starter)
# ---------------------------------------------------------------------------
# Activate alongside your run profile, e.g.:
#   --spring.profiles.active=dev,ai-anthropic
# Supply the secret at start time: REQUEL_AI_API_KEY=sk-ant-...  Override the model per run with
# REQUEL_AI_MODEL.
#
# Anthropic has NO OpenAI-compatible endpoint, so this uses the dedicated
# spring-ai-starter-model-anthropic (see assistant-ai/pom.xml). Setting spring.ai.model.chat=anthropic
# makes the Anthropic ChatModel the single active one, so the OpenAI chat autoconfiguration backs off
# (no OpenAI key needed) and the same provider-agnostic SpringAiAnalysisClient is used.
requel.ai.enabled=true
requel.ai.provider=anthropic
requel.ai.model=${REQUEL_AI_MODEL:claude-3-5-sonnet-latest}

spring.ai.model.chat=anthropic
spring.ai.anthropic.api-key=${REQUEL_AI_API_KEY:dummy-set-REQUEL_AI_API_KEY}
spring.ai.anthropic.base-url=${REQUEL_AI_BASE_URL:https://api.anthropic.com}
spring.ai.anthropic.chat.options.model=${REQUEL_AI_MODEL:claude-3-5-sonnet-latest}
spring.ai.anthropic.chat.options.max-tokens=${REQUEL_AI_MAX_OUTPUT_TOKENS:4000}
